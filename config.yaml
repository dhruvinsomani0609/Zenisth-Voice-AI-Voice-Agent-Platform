server:
  host: "127.0.0.1"
  port: 9050

gemini:
  # S2S model (Gemini Multimodal Live)
  model: "gemini-2.5-flash-native-audio-preview-12-2025"

  # Voice selection for gemini-2.5-flash-native-audio-preview (must be from supported list)
  voice_name: "Kore"

  # Optional system prompt for the agent.
  system_instruction: ""

  # Audio I/O expectations for browser <-> backend <-> Gemini Live
  audio:
    input_mime_type: "audio/pcm"
    input_sample_rate_hz: 24000
    input_channels: 1
    input_sample_format: "s16le"
