agent:
  defaults:
    barge_in: true
    endpointing: 800
    filler_audio: true
    greeting: Hi, this is Anil from TrailTribe — we’re building something for trekkers.
      Can I take 2 minutes to ask you something?
    llm_model: openai/gpt-4o-mini
    stt_model: deepgram/nova-3:en
    temperature: 0.6
    voice_emotion: helpful
    voice_model: elevenlabs/eleven_flash_v2:2EiwWnXFnvU5JabPnv8n
    voice_speed: 0.95
  models:
    llm:
    - id: openai/gpt-4o-mini
      label: GPT-4o Mini
    - id: openai/gpt-4o
      label: GPT-4o
    - id: google/gemini-2.5-flash
      label: Gemini 2.5 Flash
    - id: google/gemini-2.5-pro
      label: Gemini 2.5 Pro
    - id: deepseek/deepseek-v3
      label: DeepSeek V3
    stt:
    - id: deepgram/nova-3:en
      label: Deepgram Nova 3 (English)
    - id: deepgram/flux:en
      label: Deepgram Flux
    - id: assemblyai/universal-3-pro
      label: AssemblyAI Universal 3 Pro
    - id: cartesia/ink-whisper
      label: Cartesia Ink Whisper
    voice:
    - family: Cartesia
      gender: female
      id: cartesia/sonic-3:9626c31c-bec5-4cca-baa8-f8ba9e84c8bc
      label: English Female (Sonic 3)
    - family: Cartesia
      gender: male
      id: cartesia/sonic-3:79a125e8-cd45-4c13-8a67-188112f4dd22
      label: English Male (Sonic 3)
    - family: ElevenLabs
      gender: female
      id: elevenlabs/eleven_flash_v2:2EiwWnXFnvU5JabPnv8n
      label: Flash v2 (Expressive)
    - family: Deepgram
      gender: female
      id: deepgram/aura-2:asteria-en
      label: Asteria (Aura 2)
deepgram:
  audio:
    input:
      encoding: linear16
      sample_rate: 16000
    output:
      container: none
      encoding: linear16
      sample_rate: 16000
  url: wss://agent.deepgram.com/v1/agent/converse
server:
  http_port: 8080
  ws_port: 8765
