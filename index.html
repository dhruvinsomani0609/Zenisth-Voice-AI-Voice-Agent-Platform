<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenisth Voice — Command Center</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <div class="logo">
      <div class="logo-mark">Z</div>
      <div class="logo-text"><span>Zenisth Voice</span> Command Center</div>
    </div>

    <div class="hdr-center">
      <div id="status-pill" class="status-pill idle" title="Connection status">
        <span id="status-dot" aria-hidden="true">●</span>
        <span id="status-text">Idle</span>
      </div>
    </div>

    <div class="hdr-actions">
      <button class="btn" id="btn-settings">Settings</button>
      <button class="btn" id="btn-clear">Clear</button>
    </div>
  </header>

  <main>
    <!-- Left: Agent + Controls -->
    <section class="col">
      <div class="col-hdr">Agent <span class="badge" id="agent-state">Idle</span></div>
      <div class="col-body">
        <div class="agent-card">
          <div class="avatar-wrap">
            <div class="avatar-ring" id="avatar-ring"></div>
            <div class="avatar">Z</div>
          </div>
          <div class="agent-name">Zenisth</div>
          <div class="agent-role">Gemini Multimodal Engine</div>
          <div class="agent-company">Speech-to-Speech</div>
          <div class="agent-state">Mode: <em id="mode-text">Idle</em></div>
        </div>

        <div id="canvas-wrap">
          <canvas id="waveform" width="520" height="90"></canvas>
        </div>

        <button class="call-btn start" id="btn-start">Start Call</button>
        <button class="call-btn end" id="btn-stop" disabled>Stop Call</button>
      </div>
    </section>

    <!-- Center: Transcript -->
    <section class="col">
      <div class="col-hdr">Live Transcript <span class="badge" id="turn-badge">—</span></div>
      <div class="transcript" id="transcript">
        <div class="empty" id="empty-state">
          <div class="icon">🎙️</div>
          <p>Press <strong>Start Call</strong> to go live. Speak naturally. If you interrupt while the agent is talking, playback will stop immediately.</p>
        </div>
      </div>
    </section>

    <!-- Right: Tool Log -->
    <section class="col">
      <div class="col-hdr">Actions <span class="badge" id="fn-count">0</span></div>
      <div class="col-body" id="fn-log"></div>
    </section>
  </main>

  <div id="toast-wrap"></div>

  <!-- Settings Modal (Gemini-only) -->
  <div id="settings-modal" aria-hidden="true">
    <div class="sm-box" role="dialog" aria-modal="true" aria-label="Settings">
      <div class="sm-top">
        <h2>Settings</h2>
        <button class="modal-close" id="btn-settings-close">✕</button>
      </div>
      <div class="sm-tabs">
        <div class="sm-tab active" data-pane="engine">Engine</div>
        <div class="sm-tab" data-pane="prompt">Prompt</div>
      </div>
      <div class="sm-pane active" id="pane-engine">
        <div class="sf-row">
          <label>Gemini Multimodal Engine</label>
          <input type="text" id="gemini-model" value="Live (S2S)" disabled />
        </div>
        <div class="sf-row">
          <label>Gemini Voice</label>
          <select id="voice-name">
            <option value="Kore" selected>Kore</option>
            <option value="Aoede">Aoede</option>
            <option value="Puck">Puck</option>
            <option value="Charon">Charon</option>
            <option value="Zephyr">Zephyr</option>
            <option value="Fenrir">Fenrir</option>
            <option value="Leda">Leda</option>
          </select>
        </div>
      </div>
      <div class="sm-pane" id="pane-prompt">
        <div class="sf-row">
          <label>System Prompt Override</label>
          <textarea id="system-prompt" placeholder="Optional. Leave empty to use the default agent prompt."></textarea>
        </div>
      </div>
      <div class="sm-footer">
        <button class="btn" id="btn-settings-cancel">Cancel</button>
        <button class="btn primary" id="btn-settings-apply">Apply</button>
      </div>
    </div>
  </div>

  <script src="script.js?v=2"></script>
</body>

</html>
